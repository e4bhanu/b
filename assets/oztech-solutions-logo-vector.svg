<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OzTech Solutions logo</title>
  <desc id="desc">Vector logo for OzTech Solutions, featuring an Australian technology mark with circuit traces and a waveform.</desc>
  <defs>
    <linearGradient id="markGradient" x1="80" y1="80" x2="350" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AFC7"/>
      <stop offset="1" stop-color="#0A2A43"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="124" y1="214" x2="316" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9F1C"/>
      <stop offset="1" stop-color="#00AFC7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0A2A43" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#FFFFFF"/>

  <g transform="translate(60 42)" filter="url(#softShadow)">
    <circle cx="168" cy="168" r="150" fill="#F4FBFC"/>
    <circle cx="168" cy="168" r="137" fill="none" stroke="#D5EEF2" stroke-width="4"/>

    <path
      d="M94 154
         C105 121 134 100 171 98
         C204 96 229 111 247 137
         C270 139 290 154 297 177
         C303 198 293 220 272 229
         C260 247 235 255 211 248
         C190 266 158 265 136 246
         C113 248 92 235 85 214
         C75 190 80 169 94 154Z"
      fill="url(#markGradient)"/>

    <path
      d="M112 195
         H145
         L158 171
         L178 230
         L199 147
         L216 195
         H260"
      fill="none"
      stroke="url(#waveGradient)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <path d="M140 133 H178 V112"/>
      <path d="M225 151 H252"/>
      <path d="M124 225 H151 V252"/>
      <path d="M225 230 V257 H248"/>
    </g>

    <g fill="#FFFFFF">
      <circle cx="178" cy="112" r="8"/>
      <circle cx="252" cy="151" r="8"/>
      <circle cx="151" cy="252" r="8"/>
      <circle cx="248" cy="257" r="8"/>
    </g>

    <circle cx="286" cy="266" r="12" fill="#FF9F1C"/>
  </g>

  <g transform="translate(425 118)">
    <text
      x="0"
      y="88"
      font-family="Inter, Montserrat, Avenir Next, Arial, sans-serif"
      font-size="98"
      font-weight="800"
      letter-spacing="-3"
      fill="#0A2A43">OzTech</text>

    <text
      x="4"
      y="157"
      font-family="Inter, Montserrat, Avenir Next, Arial, sans-serif"
      font-size="50"
      font-weight="600"
      letter-spacing="7"
      fill="#00AFC7">SOLUTIONS</text>

    <rect x="4" y="181" width="392" height="6" rx="3" fill="#FF9F1C"/>
    <text
      x="4"
      y="224"
      font-family="Inter, Montserrat, Avenir Next, Arial, sans-serif"
      font-size="24"
      font-weight="500"
      letter-spacing="1.8"
      fill="#466275">TECHNICAL EQUIPMENT RENTAL - ENGINEERING CONSULTANCY</text>
  </g>
</svg>
